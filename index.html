<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShiftLog 2026</title>
  <style>
    :root { --bg: #0d0d0f; --card: #13131a; --border: #2a2420; --accent: #f59e0b; --text: #e8e4dc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; direction: rtl; min-height: 100vh; line-height: 1.5; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .logo { font-size: 22px; font-weight: 800; color: var(--accent); }
    
    .stats-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .stat-label { font-size: 12px; color: #888; display: block; }
    .stat-val { font-size: 18px; font-weight: bold; color: var(--text); }

    nav { display: flex; gap: 10px; margin-bottom: 20px; }
    nav button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: #888; cursor: pointer; font-weight: 600; }
    nav button.active { background: var(--card); border-color: var(--accent); color: var(--accent); }
    .btn-add { background: var(--accent) !important; color: #000 !important; border: none !important; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
    .field { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-save { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    
    .shift-item { background: var(--card); border-right: 4px solid var(--accent); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .shift-info h4 { font-size: 16px; margin-bottom: 4px; }
    .shift-info p { font-size: 13px; color: #888; }
    .shift-price { text-align: left; }
    .price-val { font-size: 18px; font-weight: bold; color: var(--accent); }
    .btn-del { background: transparent; border: none; color: #ef4444; cursor: pointer; padding: 5px; margin-right: 10px; }

    .empty { text-align: center; padding: 40px; color: #555; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 100; display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">⚡ ShiftLog</div>
    <div id="top-total" style="font-weight: bold;">₪ 0</div>
  </header>

  <div class="stats-main">
    <div class="stat-box">
      <span class="stat-label">הכנסה החודש</span>
      <span class="stat-val" id="month-earn">₪ 0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">משמרות החודש</span>
      <span class="stat-val" id="month-count">0</span>
    </div>
  </div>

  <nav>
    <button id="nav-list" class="active" onclick="showTab('list')">רשימה</button>
    <button id="nav-add" class="btn-add" onclick="showTab('add')">+ משמרת</button>
    <button id="nav-stats" onclick="showTab('stats')">סיכום</button>
  </nav>

  <div id="tab-list">
    <div id="shifts-container"></div>
  </div>

  <div id="tab-add" style="display: none;">
    <div class="card">
      <div class="field">
        <label>סוג עבודה</label>
        <select id="f-job">
          <option value="מלצרות">🍽️ מלצרות</option>
          <option value="בר">🍸 בר</option>
          <option value="אחר">💼 אחר</option>
        </select>
      </div>
      <div class="field">
        <label>תאריך</label>
        <input type="date" id="f-date">
      </div>
      <div class="grid">
        <div class="field">
          <label>כניסה</label>
          <input type="time" id="f-start">
        </div>
        <div class="field">
          <label>יציאה</label>
          <input type="time" id="f-end">
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>שכר לשעה / גלובלי</label>
          <input type="number" id="f-pay" placeholder="0">
        </div>
        <div class="field">
          <label>טיפים</label>
          <input type="number" id="f-tip" placeholder="0">
        </div>
      </div>
      <button class="btn-save" onclick="saveShift()">שמור משמרת</button>
    </div>
  </div>

  <div id="tab-stats" style="display: none;">
    <div class="card">
      <h3>סיכום כללי</h3>
      <div id="stats-content"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast">נשמר בהצלחה!</div>

<script>
  let shifts = JSON.parse(localStorage.getItem('shifts_v2')) || [];

  function showTab(tab) {
    document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
    document.getElementById('tab-add').style.display = tab === 'add' ? 'block' : 'none';
    document.getElementById('tab-stats').style.display = tab === 'stats' ? 'block' : 'none';
    
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-' + tab).classList.add('active');
    
    if(tab === 'list') renderShifts();
    if(tab === 'stats') renderStats();
  }

  function saveShift() {
    const job = document.getElementById('f-job').value;
    const date = document.getElementById('f-date').value;
    const start = document.getElementById('f-start').value;
    const end = document.getElementById('f-end').value;
    const pay = parseFloat(document.getElementById('f-pay').value) || 0;
    const tip = parseFloat(document.getElementById('f-tip').value) || 0;

    if(!date || !start || !end) {
      alert("נא למלא תאריך ושעות");
      return;
    }

    const newShift = { id: Date.now(), job, date, start, end, pay, tip };
    shifts.push(newShift);
    localStorage.setItem('shifts_v2', JSON.stringify(shifts));
    
    showToast();
    resetForm();
    updateMainStats();
    showTab('list');
  }

  function resetForm() {
    document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-start').value = "";
    document.getElementById('f-end').value = "";
    document.getElementById('f-pay').value = "";
    document.getElementById('f-tip').value = "";
  }

  function renderShifts() {
    const container = document.getElementById('shifts-container');
    if(shifts.length === 0) {
      container.innerHTML = '<div class="empty">אין משמרות רשומות</div>';
      return;
    }

    const sorted = [...shifts].sort((a,b) => new Date(b.date) - new Date(a.date));
    container.innerHTML = sorted.map(s => {
      const total = s.pay + s.tip;
      return `
        <div class="shift-item">
          <div class="shift-info">
            <h4>${s.job}</h4>
            <p>${s.date.split('-').reverse().join('/')} | ${s.start}-${s.end}</p>
          </div>
          <div style="display:flex; align-items:center;">
            <div class="shift-price">
              <div class="price-val">₪${total}</div>
            </div>
            <button class="btn-del" onclick="deleteShift(${s.id})">🗑️</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function deleteShift(id) {
    if(confirm("למחוק את המשמרת?")) {
      shifts = shifts.filter(s => s.id !== id);
      localStorage.setItem('shifts_v2', JSON.stringify(shifts));
      renderShifts();
      updateMainStats();
    }
  }

  function updateMainStats() {
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    const monthShifts = shifts.filter(s => {
      const d = new Date(s.date);
      return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
    });

    const totalEarn = monthShifts.reduce((sum, s) => sum + (s.pay + s.tip), 0);
    const allTimeTotal = shifts.reduce((sum, s) => sum + (s.pay + s.tip), 0);

    document.getElementById('month-earn').innerText = '₪ ' + totalEarn;
    document.getElementById('month-count').innerText = monthShifts.length;
    document.getElementById('top-total').innerText = '₪ ' + allTimeTotal;
  }

  function renderStats() {
    const statsContent = document.getElementById('stats-content');
    const totalPay = shifts.reduce((sum, s) => sum + s.pay, 0);
    const totalTips = shifts.reduce((sum, s) => sum + s.tip, 0);
    
    statsContent.innerHTML = `
      <div style="margin-top:10px;">
        <p>סה"כ שכר בסיס: ₪${totalPay}</p>
        <p>סה"כ טיפים: ₪${totalTips}</p>
        <hr style="margin:10px 0; border:0; border-top:1px solid #222;">
        <p style="font-size:20px; color:var(--accent);">סה"כ הכל: ₪${totalPay + totalTips}</p>
      </div>
    `;
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  // אתחול
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  updateMainStats();
  renderShifts();
</script>

</body>
</html>
