<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ShiftLog</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0d0d0f; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e4dc; }
        /* עיצוב כפתורי זמן ותאריך */
        input[type=date]::-webkit-calendar-picker-indicator,
        input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const JOB_COLORS = ["#f59e0b","#10b981","#3b82f6","#ec4899","#8b5cf6","#ef4444","#06b6d4","#f97316"];
        const DEFAULT_JOBS = [
            { id: "waiter", label: "מלצרות", icon: "🍽️", color: "#10b981" },
            { id: "bar", label: "בר", icon: "🍸", color: "#f59e0b" },
        ];

        const formatCurrency = (n) => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);

        function ShiftTracker() {
            const [jobs, setJobs] = useState(() => {
                const saved = localStorage.getItem("shiftlog_jobs");
                return saved ? JSON.parse(saved) : DEFAULT_JOBS;
            });
            const [shifts, setShifts] = useState(() => {
                const saved = localStorage.getItem("shiftlog_shifts");
                return saved ? JSON.parse(saved) : [];
            });
            const [view, setView] = useState("shifts"); // 'shifts', 'add', 'stats'
            const [showJobManager, setShowJobManager] = useState(false);

            useEffect(() => { localStorage.setItem("shiftlog_jobs", JSON.stringify(jobs)); }, [jobs]);
            useEffect(() => { localStorage.setItem("shiftlog_shifts", JSON.stringify(shifts)); }, [shifts]);

            const stats = useMemo(() => {
                const totalEarnings = shifts.reduce((a, s) => a + (parseFloat(s.total) || 0), 0);
                const totalTips = shifts.reduce((a, s) => a + (parseFloat(s.tip) || 0), 0);
                return { total: totalEarnings + totalTips, count: shifts.length };
            }, [shifts]);

            return (
                <div style={st.root}>
                    {/* Header - כמו ב-image_8.png */}
                    <header style={st.header}>
                        <div style={st.headerInner}>
                            <div style={{ textAlign: "right" }}>
                                <div style={st.logo}>ShiftLog ⚡</div>
                                <div style={st.logoSub}>מעקב משמרות</div>
                            </div>
                            <div style={{ display: "flex", gap: 20 }}>
                                <div style={{ textAlign: "center" }}>
                                    <div style={st.hVal}>{formatCurrency(stats.total)}</div>
                                    <div style={st.hLbl}>סה״כ</div>
                                </div>
                                <div style={{ textAlign: "center" }}>
                                    <div style={st.hVal}>{stats.count}</div>
                                    <div style={st.hLbl}>משמרות</div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation - כמו ב-image_8.png */}
                    <nav style={st.nav}>
                        <button style={st.navAdd} onClick={() => setView("add")}>+ משמרת</button>
                        <button style={{...st.navBtn, ...(view === 'stats' ? st.navActive : {})}} onClick={() => setView("stats")}>📊 סטטיסטיקות</button>
                        <button style={{...st.navBtn, ...(view === 'shifts' ? st.navActive : {})}} onClick={() => setView("shifts")}>📋 משמרות</button>
                    </nav>

                    {/* Main Content */}
                    <main style={st.main}>
                        {view === "shifts" && shifts.length === 0 && (
                            <div style={st.empty}>
                                <div style={{ fontSize: 60, marginBottom: 15 }}>🍽️</div>
                                <div style={{ fontSize: 18, color: "#e8e4dc", fontWeight: "600" }}>אין משמרות עדיין</div>
                                <div style={{ fontSize: 14, color: "#666", marginTop: 8 }}>לחץ על "+ משמרת" כדי להתחיל</div>
                                
                                <button style={st.mngBtn} onClick={() => setShowJobManager(true)}>
                                    ⚙️ ניהול עבודות
                                </button>
                            </div>
                        )}
                        
                        {/* כאן תבוא הלוגיקה של הוספת משמרת ורשימה */}
                        {view === "add" && (
                            <div style={{textAlign: 'center', padding: 20}}>
                                <p>כאן יהיה הטופס (המשך הקוד המקורי שלך)</p>
                                <button style={st.navBtn} onClick={() => setView("shifts")}>חזור</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const st = {
            root: { minHeight: "100vh", background: "#0d0d0f", direction: "rtl" },
            header: { background: "#13131a", padding: "20px 16px", borderBottom: "1px solid #2a2420" },
            headerInner: { maxWidth: 500, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" },
            logo: { fontSize: 22, fontWeight: "900", color: "#f59e0b" },
            logoSub: { fontSize: 11, color: "#666", marginTop: -2 },
            hVal: { fontSize: 18, fontWeight: "700", color: "#f0ead8" },
            hLbl: { fontSize: 10, color: "#666" },
            nav: { maxWidth: 500, margin: "12px auto", display: "flex", gap: 8, padding: "0 16px" },
            navBtn: { flex: 1, padding: "10px 0", borderRadius: 10, border: "1px solid #2a2420", background: "transparent", color: "#888", fontSize: 13, cursor: "pointer" },
            navActive: { borderColor: "#f59e0b", color: "#f59e0b", background: "#f59e0b11" },
            navAdd: { flex: 1, padding: "10px 0", borderRadius: 10, background: "#f59e0b", border: "none", fontWeight: "bold", color: "#000", cursor: "pointer" },
            main: { maxWidth: 500, margin: "0 auto", padding: "0 16px" },
            empty: { textAlign: "center", paddingTop: 100 },
            mngBtn: { marginTop: 40, padding: "10px 20px", borderRadius: 10, border: "1px solid #2a2420", background: "transparent", color: "#888", fontSize: 14, cursor: "pointer" }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftTracker />);
    </script>
</body>
</html>
