<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ShiftLog</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #0d0d0f; font-family: system-ui, -apple-system, sans-serif; }
        input[type=date]::-webkit-calendar-picker-indicator,
        input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const JOB_COLORS = ["#f59e0b","#10b981","#3b82f6","#ec4899","#8b5cf6","#ef4444","#06b6d4","#f97316"];
        const JOB_ICONS = ["🍽️","🍸","🚗","💼","🛒","🎯","🏗️","💻","🎨","🏥","📦","🎤"];
        const MONTHS_HE = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

        const DEFAULT_JOBS = [
            { id: "waiter", label: "מלצרות", icon: "🍽️", color: "#10b981" },
            { id: "bar", label: "בר", icon: "🍸", color: "#f59e0b" },
        ];

        const todayStr = () => new Date().toISOString().split("T")[0];
        const formatCurrency = (n) => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);
        
        const calcHours = (start, end) => {
            if (!start || !end) return 0;
            const [sh, sm] = start.split(":").map(Number);
            const [eh, em] = end.split(":").map(Number);
            let mins = eh * 60 + em - (sh * 60 + sm);
            if (mins < 0) mins += 24 * 60;
            return +(mins / 60).toFixed(2);
        };

        const load = (key, fallback) => {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? JSON.parse(val) : fallback;
            } catch { return fallback; }
        };
        const save = (key, val) => {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
        };

        function ShiftTracker() {
            const [jobs, setJobs] = useState(() => load("shiftlog_jobs", DEFAULT_JOBS));
            const [shifts, setShifts] = useState(() => load("shiftlog_shifts", []));
            const [view, setView] = useState("shifts");
            const [editId, setEditId] = useState(null);
            const [toast, setToast] = useState(null);
            const [showJobManager, setShowJobManager] = useState(false);
            const [newJobLabel, setNewJobLabel] = useState("");
            const [newJobIcon, setNewJobIcon] = useState("🍽️");
            const [newJobColor, setNewJobColor] = useState(JOB_COLORS[0]);

            useEffect(() => { save("shiftlog_jobs", jobs); }, [jobs]);
            useEffect(() => { save("shiftlog_shifts", shifts); }, [shifts]);

            const firstJobId = jobs[0]?.id || "";
            const emptyForm = { date: todayStr(), start: "", end: "", total: "", tip: "", travel: "", notes: "", jobType: firstJobId, payMode: "total" };
            const [form, setForm] = useState(emptyForm);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

            const saveShift = () => {
                if (!form.start || !form.end) { showToast("נא להזין שעת התחלה וסיום"); return; }
                let finalTotal = form.total;
                if (form.payMode === "hourly" && form.total) {
                    finalTotal = (parseFloat(form.total) * calcHours(form.start, form.end)).toFixed(2);
                }
                const shiftData = { ...form, total: finalTotal };
                if (editId !== null) {
                    setShifts(s => s.map(sh => sh.id === editId ? { ...shiftData, id: editId } : sh));
                    showToast("משמרת עודכנה ✓");
                    setEditId(null);
                } else {
                    setShifts(s => [{ ...shiftData, id: Date.now() }, ...s]);
                    showToast("משמרת נוספה ✓");
                }
                setForm({ ...emptyForm, jobType: form.jobType });
                setView("shifts");
            };

            const stats = useMemo(() => {
                const totalEarnings = shifts.reduce((a, s) => a + (parseFloat(s.total) || 0), 0);
                const totalTips = shifts.reduce((a, s) => a + (parseFloat(s.tip) || 0), 0);
                const totalHours = shifts.reduce((a, s) => a + calcHours(s.start, s.end), 0);
                const byMonth = {};
                shifts.forEach(s => {
                    const key = s.date.slice(0, 7);
                    if (!byMonth[key]) byMonth[key] = { earnings: 0, tips: 0, hours: 0 };
                    byMonth[key].earnings += parseFloat(s.total) || 0;
                    byMonth[key].tips += parseFloat(s.tip) || 0;
                });
                return { totalEarnings, totalTips, totalHours, byMonth };
            }, [shifts]);

            const liveHours = calcHours(form.start, form.end);
            const liveTotal = form.payMode === "hourly" && form.total ? parseFloat(form.total) * liveHours : parseFloat(form.total) || 0;

            return (
                <div className="min-h-screen text-gray-200 pb-10" style={{background: '#0d0d0f'}}>
                    {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-800 border border-amber-500/40 text-amber-500 px-6 py-2 rounded-xl z-50 shadow-2xl">{toast}</div>}
                    
                    <header className="p-6 bg-gradient-to-br from-gray-900 to-black border-b border-gray-800">
                        <div className="max-w-md mx-auto flex justify-between items-end">
                            <div>
                                <h1 className="text-2xl font-black text-amber-500">⚡ ShiftLog</h1>
                                <p className="text-xs text-gray-500">מעקב משמרות</p>
                            </div>
                            <div className="text-right">
                                <span className="block text-lg font-bold">{formatCurrency(stats.totalEarnings + stats.totalTips)}</span>
                                <span className="text-[10px] text-gray-500 uppercase">סה״כ רווחים</span>
                            </div>
                        </div>
                    </header>

                    <nav className="max-w-md mx-auto flex gap-2 p-4">
                        <button onClick={() => setView('shifts')} className={`flex-1 py-2 rounded-lg border border-gray-800 ${view === 'shifts' ? 'bg-gray-800 text-white border-amber-500/30' : 'text-gray-500'}`}>📋 משמרות</button>
                        <button onClick={() => setView('stats')} className={`flex-1 py-2 rounded-lg border border-gray-800 ${view === 'stats' ? 'bg-gray-800 text-white border-amber-500/30' : 'text-gray-500'}`}>📊 סטטיסטיקה</button>
                        <button onClick={() => setView('add')} className="px-4 py-2 bg-amber-500 text-black font-bold rounded-lg">+ משמרת</button>
                    </nav>

                    <main className="max-w-md mx-auto px-4">
                        {view === 'add' && (
                            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4">
                                <h2 className="text-lg font-bold text-gray-100">{editId ? "✏️ עריכת משמרת" : "➕ משמרת חדשה"}</h2>
                                
                                <div>
                                    <label className="text-xs text-gray-500 block mb-2">סוג עבודה</label>
                                    <div className="flex flex-wrap gap-2">
                                        {jobs.map(j => (
                                            <button key={j.id} onClick={() => setForm({...form, jobType: j.id})} 
                                                className={`px-3 py-2 rounded-lg border ${form.jobType === j.id ? 'border-amber-500 bg-amber-500/10 text-amber-500' : 'border-gray-800 text-gray-500'}`}>
                                                {j.icon} {j.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">התחלה</label>
                                        <input type="time" className="w-full bg-black border border-gray-800 rounded-lg p-2" value={form.start} onChange={e => setForm({...form, start: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">סיום</label>
                                        <input type="time" className="w-full bg-black border border-gray-800 rounded-lg p-2" value={form.end} onChange={e => setForm({...form, end: e.target.value})} />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">שכר/סה"כ</label>
                                        <input type="number" className="w-full bg-black border border-gray-800 rounded-lg p-2" value={form.total} onChange={e => setForm({...form, total: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">טיפ</label>
                                        <input type="number" className="w-full bg-black border border-gray-800 rounded-lg p-2" value={form.tip} onChange={e => setForm({...form, tip: e.target.value})} />
                                    </div>
                                </div>

                                <div className="pt-4 flex gap-2">
                                    <button onClick={() => setView('shifts')} className="flex-1 py-3 border border-gray-800 rounded-xl text-gray-500">ביטול</button>
                                    <button onClick={saveShift} className="flex-[2] py-3 bg-amber-500 text-black font-bold rounded-xl">שמור משמרת</button>
                                </div>
                            </div>
                        )}

                        {view === 'shifts' && (
                            <div className="space-y-3">
                                {shifts.length === 0 ? (
                                    <div className="text-center py-20 text-gray-600">אין משמרות עדיין</div>
                                ) : (
                                    shifts.map(s => {
                                        const job = jobs.find(j => j.id === s.jobType);
                                        return (
                                            <div key={s.id} className="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex">
                                                <div className="w-1" style={{background: job?.color || '#333'}}></div>
                                                <div className="p-4 flex-1 flex justify-between items-center">
                                                    <div>
                                                        <div className="text-xs font-bold" style={{color: job?.color}}>{job?.icon} {job?.label}</div>
                                                        <div className="text-sm text-gray-400">{s.date} | {calcHours(s.start, s.end)} שע׳</div>
                                                    </div>
                                                    <div className="text-left">
                                                        <div className="text-lg font-bold text-gray-100">{formatCurrency(parseFloat(s.total) + (parseFloat(s.tip) || 0))}</div>
                                                        <button onClick={() => setShifts(shifts.filter(sh => sh.id !== s.id))} className="text-[10px] text-red-900">מחק</button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}
                        
                        {view === 'stats' && (
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                                    <div className="text-2xl font-bold text-amber-500">{stats.totalHours.toFixed(1)}</div>
                                    <div className="text-xs text-gray-500">שעות עבודה</div>
                                </div>
                                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                                    <div className="text-2xl font-bold text-amber-500">{formatCurrency((stats.totalEarnings + stats.totalTips) / (stats.totalHours || 1))}</div>
                                    <div className="text-xs text-gray-500">ממוצע לשעה</div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftTracker />);
    </script>
</body>
</html>
