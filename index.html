<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון משמרות</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        function ShiftTracker() {
            const [shifts, setShifts] = useState(() => {
                const saved = localStorage.getItem('shifts');
                return saved ? JSON.parse(saved) : [];
            });

            const [wage, setWage] = useState(() => localStorage.getItem('wage') || "35");

            useEffect(() => {
                localStorage.setItem('shifts', JSON.stringify(shifts));
                localStorage.setItem('wage', wage);
            }, [shifts, wage]);

            const totalPay = useMemo(() => {
                return shifts.reduce((sum, s) => sum + (parseFloat(s.hours) * parseFloat(wage)), 0);
            }, [shifts, wage]);

            const addShift = () => {
                const date = new Date().toLocaleDateString('he-IL');
                setShifts([...shifts, { date, hours: "8", id: Date.now() }]);
            };

            const removeShift = (id) => setShifts(shifts.filter(s => s.id !== id));

            return (
                <div class="p-4 max-w-md mx-auto">
                    <h1 class="text-2xl font-bold mb-4 text-center">מעקב משמרות</h1>
                    
                    <div class="bg-white p-4 rounded-lg shadow mb-4">
                        <label class="block text-sm mb-1">שכר שעתי:</label>
                        <input type="number" value={wage} onChange={(e) => setWage(e.target.value)} class="border p-2 w-full rounded" />
                    </div>

                    <button onClick={addShift} class="bg-blue-500 text-white w-full py-3 rounded-lg font-bold mb-4">הוסף משמרת (8 שעות)</button>

                    <div class="space-y-2">
                        {shifts.map(s => (
                            <div key={s.id} class="bg-white p-3 rounded shadow flex justify-between items-center">
                                <span>{s.date} - {s.hours} שעות</span>
                                <button onClick={() => removeShift(s.id)} class="text-red-500 text-sm">מחק</button>
                            </div>
                        ))}
                    </div>

                    <div class="mt-6 p-4 bg-green-100 rounded-lg text-center font-bold text-xl">
                        סה"כ לתשלום: ₪{totalPay.toFixed(2)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftTracker />);
    </script>
</body>
</html>
