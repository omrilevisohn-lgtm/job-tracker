<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ ShiftLog Premium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0f; color: #e8e4dc; font-family: 'Segoe UI', system-ui, sans-serif; direction: rtl; min-height: 100vh; padding-bottom: 40px; }
    
    /* Header & Stats */
    .header { background: linear-gradient(135deg,#13131a,#1a1612); border-bottom: 1px solid #2a2420; padding: 20px 16px; }
    .header-inner { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: 800; color: #f59e0b; }
    .h-stats { display: flex; gap: 15px; }
    .h-item { text-align: center; }
    .h-val { display: block; font-size: 18px; font-weight: 700; color: #f0ead8; }
    .h-lbl { font-size: 11px; color: #666; }

    /* Navigation */
    nav { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; padding: 12px 16px; }
    .nav-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #2a2420; background: transparent; color: #888; font-weight: 600; cursor: pointer; }
    .nav-btn.active { background: #1e1a14; border-color: #f59e0b44; color: #f0ead8; }
    .nav-add { background: #f59e0b !important; color: #0d0d0f !important; border: none !important; }

    /* Main Content */
    main { max-width: 520px; margin: 0 auto; padding: 0 16px; }
    .card { background: #13131a; border: 1px solid #2a2420; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 18px; font-weight: 700; color: #f0ead8; margin-bottom: 15px; display: flex; justify-content: space-between; }

    /* Forms */
    .fg { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    input, select, textarea { width: 100%; background: #0d0d0f; border: 1px solid #2a2420; border-radius: 10px; padding: 12px; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #f59e0b; }
    .r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Buttons */
    .btn-primary { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #f59e0b; color: #0d0d0f; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-sec { background: transparent; border: 1px solid #2a2420; color: #888; padding: 8px 12px; border-radius: 8px; font-size: 13px; }

    /* Shift Items */
    .shift-card { background: #13131a; border: 1px solid #2a2420; border-radius: 14px; margin-bottom: 12px; display: flex; overflow: hidden; position: relative; }
    .shift-accent { width: 4px; background: #f59e0b; }
    .shift-body { flex: 1; padding: 15px; }
    .shift-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .shift-amount { font-size: 18px; font-weight: bold; color: #f59e0b; }
    .shift-meta { font-size: 13px; color: #666; margin-top: 5px; }
    .btn-del { position: absolute; left: 15px; bottom: 15px; background: none; border: none; color: #ef4444; font-size: 16px; opacity: 0.6; }

    /* Utilities */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #f59e0b; color: #000; padding: 10px 20px; border-radius: 10px; font-weight: bold; display: none; z-index: 1000; }
  </style>
</head>
<body>

  <div id="toast" class="toast">נשמר בהצלחה!</div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">⚡ ShiftLog</div>
      <div class="h-stats">
        <div class="h-item"><span class="h-val" id="stat-total">₪ 0</span><span class="h-lbl">סה"כ</span></div>
        <div class="h-item"><span class="h-val" id="stat-count">0</span><span class="h-lbl">משמרות</span></div>
      </div>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" id="btn-list" onclick="setView('list')">משמרות</button>
    <button class="nav-btn nav-add" onclick="setView('add')">+ חדשה</button>
    <button class="nav-btn" id="btn-stats" onclick="setView('stats')">סטטיסטיקה</button>
  </nav>

  <main id="main-content">
    <!-- תוכן דינמי כאן -->
  </main>

  <script>
    let shifts = JSON.parse(localStorage.getItem('sl_data')) || [];
    let currentView = 'list';

    // פונקציה לחישוב שעות
    function calcHours(s, e) {
      if (!s || !e) return 0;
      let start = s.split(':').map(Number);
      let end = e.split(':').map(Number);
      let mins = (end[0] * 60 + end[1]) - (start[0] * 60 + start[1]);
      if (mins < 0) mins += 1440; // מעבר חצות
      return (mins / 60).toFixed(2);
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if(view !== 'add') document.getElementById('btn-' + view).classList.add('active');
      render();
    }

    function render() {
      const main = document.getElementById('main-content');
      updateHeader();

      if (currentView === 'list') {
        renderList(main);
      } else if (currentView === 'add') {
        renderAdd(main);
      } else if (currentView === 'stats') {
        renderStats(main);
      }
    }

    function updateHeader() {
      const total = shifts.reduce((sum, s) => sum + (parseFloat(s.total) || 0) + (parseFloat(s.tip) || 0), 0);
      document.getElementById('stat-total').innerText = '₪' + total.toLocaleString();
      document.getElementById('stat-count').innerText = shifts.length;
    }

    function renderList(el) {
      if (shifts.length === 0) {
        el.innerHTML = '<div style="text-align:center; padding:50px; color:#444;">אין משמרות עדיין</div>';
        return;
      }
      const sorted = [...shifts].sort((a,b) => new Date(b.date) - new Date(a.date));
      el.innerHTML = sorted.map(s => `
        <div class="shift-card">
          <div class="shift-accent"></div>
          <div class="shift-body">
            <div class="shift-top">
              <div>
                <strong style="color:#f0ead8">${s.job}</strong>
                <div style="font-size:12px; color:#666;">${s.date.split('-').reverse().join('.')}</div>
              </div>
              <div class="shift-amount">₪${(parseFloat(s.total) + (parseFloat(s.tip) || 0)).toLocaleString()}</div>
            </div>
            <div class="shift-meta">🕐 ${s.start} - ${s.end} (${calcHours(s.start, s.end)} שעות)</div>
            ${s.tip > 0 ? `<div style="font-size:12px; color:#f59e0b;">🤑 טיפ: ₪${s.tip}</div>` : ''}
            <button class="btn-del" onclick="deleteShift(${s.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function renderAdd(el) {
      el.innerHTML = `
        <div class="card">
          <div class="card-title">משמרת חדשה</div>
          <div class="fg"><label>עבודה</label><input type="text" id="f-job" placeholder="למשל: מלצרות"></div>
          <div class="fg"><label>תאריך</label><input type="date" id="f-date" value="${new Date().toISOString().split('T')[0]}"></div>
          <div class="r2">
            <div class="fg"><label>כניסה</label><input type="time" id="f-start"></div>
            <div class="fg"><label>יציאה</label><input type="time" id="f-end"></div>
          </div>
          <div class="r2">
            <div class="fg"><label>שכר בסיס</label><input type="number" id="f-total" placeholder="0"></div>
            <div class="fg"><label>טיפ</label><input type="number" id="f-tip" placeholder="0"></div>
          </div>
          <button class="btn-primary" onclick="saveShift()">שמור משמרת</button>
          <button class="btn-sec" onclick="setView('list')" style="width:100%; margin-top:10px;">ביטול</button>
        </div>
      `;
    }

    function renderStats(el) {
      const tips = shifts.reduce((a,s) => a + (parseFloat(s.tip)||0), 0);
      const base = shifts.reduce((a,s) => a + (parseFloat(s.total)||0), 0);
      el.innerHTML = `
        <div class="card">
          <div class="card-title">סיכום רווחים</div>
          <div class="fg" style="display:flex; justify-content:space-between;"><span>שכר בסיס:</span><span>₪${base}</span></div>
          <div class="fg" style="display:flex; justify-content:space-between;"><span>טיפים:</span><span>₪${tips}</span></div>
          <hr style="border-color:#222; margin:10px 0;">
          <div class="fg" style="display:flex; justify-content:space-between; font-weight:bold; color:#f59e0b;"><span>סה"כ נטו:</span><span>₪${base+tips}</span></div>
        </div>
        <button class="btn-sec" onclick="exportCSV()" style="width:100%">📥 ייצוא ל-Excel (CSV)</button>
      `;
    }

    function saveShift() {
      const shift = {
        id: Date.now(),
        job: document.getElementById('f-job').value || 'כללי',
        date: document.getElementById('f-date').value,
        start: document.getElementById('f-start').value,
        end: document.getElementById('f-end').value,
        total: document.getElementById('f-total').value || 0,
        tip: document.getElementById('f-tip').value || 0
      };

      if(!shift.start || !shift.end) return alert('נא להזין שעות');
      
      shifts.push(shift);
      localStorage.setItem('sl_data', JSON.stringify(shifts));
      showToast();
      setView('list');
    }

    function deleteShift(id) {
      if(confirm('למחוק משמרת זו?')) {
        shifts = shifts.filter(s => s.id !== id);
        localStorage.setItem('sl_data', JSON.stringify(shifts));
        render();
      }
    }

    function showToast() {
      const t = document.getElementById('toast');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    function exportCSV() {
      let csv = "תאריך,עבודה,כניסה,יציאה,שכר,טיפ\n";
      shifts.forEach(s => {
        csv += `${s.date},${s.job},${s.start},${s.end},${s.total},${s.tip}\n`;
      });
      const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "shifts.csv";
      link.click();
    }

    render();
  </script>
</body>
</html>
