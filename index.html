<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ShiftLog Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0d0d0f; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e4dc; overflow-x: hidden; }
        input, button, textarea { font-family: inherit; }
        input[type=date]::-webkit-calendar-picker-indicator,
        input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes modalIn { from { opacity:0; transform:scale(.96) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect, Fragment } = React;

        const JOB_COLORS = ["#f59e0b","#10b981","#3b82f6","#ec4899","#8b5cf6","#ef4444","#06b6d4","#f97316"];
        const JOB_ICONS = ["🍽️","🍸","🚗","💼","🛒","🎯","🏗️","💻","🎨","🏥","📦","🎤"];
        const MONTHS_HE = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

        const DEFAULT_JOBS = [
            { id: "waiter", label: "מלצרות", icon: "🍽️", color: "#10b981" },
            { id: "bar", label: "בר", icon: "🍸", color: "#f59e0b" },
        ];

        const todayStr = () => new Date().toISOString().split("T")[0];
        const formatCurrency = (n) =>
            new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);
        
        const calcHours = (start, end) => {
            if (!start || !end) return 0;
            const [sh, sm] = start.split(":").map(Number);
            const [eh, em] = end.split(":").map(Number);
            let mins = eh * 60 + em - (sh * 60 + sm);
            if (mins < 0) mins += 24 * 60;
            return +(mins / 60).toFixed(2);
        };

        const load = (key, fallback) => {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? JSON.parse(val) : fallback;
            } catch { return fallback; }
        };
        const save = (key, val) => {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
        };

        function ShiftTracker() {
            const [jobs, setJobs] = useState(() => load("shiftlog_jobs", DEFAULT_JOBS));
            const [shifts, setShifts] = useState(() => load("shiftlog_shifts", []));
            const [view, setView] = useState("shifts");
            const [editId, setEditId] = useState(null);
            const [toast, setToast] = useState(null);
            const [showJobManager, setShowJobManager] = useState(false);
            const [newJobLabel, setNewJobLabel] = useState("");
            const [newJobIcon, setNewJobIcon] = useState("🍽️");
            const [newJobColor, setNewJobColor] = useState(JOB_COLORS[0]);

            const firstJobId = jobs[0]?.id || "";
            const emptyForm = { date: todayStr(), start: "", end: "", total: "", tip: "", travel: "", notes: "", jobType: firstJobId, payMode: "total" };
            const [form, setForm] = useState(emptyForm);

            useEffect(() => { save("shiftlog_jobs", jobs); }, [jobs]);
            useEffect(() => { save("shiftlog_shifts", shifts); }, [shifts]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

            const saveShift = () => {
                if (!form.start || !form.end) { showToast("נא להזין שעת התחלה וסיום"); return; }
                let finalTotal = form.total;
                if (form.payMode === "hourly" && form.total) {
                    finalTotal = (parseFloat(form.total) * calcHours(form.start, form.end)).toFixed(2);
                }
                const shiftData = { ...form, total: finalTotal };
                if (editId !== null) {
                    setShifts(s => s.map(sh => sh.id === editId ? { ...shiftData, id: editId } : sh));
                    showToast("משמרת עודכנה ✓");
                    setEditId(null);
                } else {
                    setShifts(s => [{ ...shiftData, id: Date.now() }, ...s]);
                    showToast("משמרת נוספה ✓");
                }
                setForm({ ...emptyForm, jobType: form.jobType });
                setView("shifts");
            };

            const deleteShift = (id) => { 
                if(confirm("למחוק את המשמרת?")) {
                    setShifts(s => s.filter(sh => sh.id !== id)); 
                    showToast("נמחק"); 
                    setView("shifts");
                }
            };

            const stats = useMemo(() => {
                const totalEarnings = shifts.reduce((a, s) => a + (parseFloat(s.total) || 0), 0);
                const totalTips = shifts.reduce((a, s) => a + (parseFloat(s.tip) || 0), 0);
                const totalTravel = shifts.reduce((a, s) => a + (parseFloat(s.travel) || 0), 0);
                const totalHours = shifts.reduce((a, s) => a + calcHours(s.start, s.end), 0);
                const byMonth = {};
                shifts.forEach(s => {
                    const key = s.date.slice(0, 7);
                    if (!byMonth[key]) byMonth[key] = { earnings: 0, tips: 0, hours: 0, count: 0 };
                    byMonth[key].earnings += parseFloat(s.total) || 0;
                    byMonth[key].tips += parseFloat(s.tip) || 0;
                    byMonth[key].hours += calcHours(s.start, s.end);
                    byMonth[key].count++;
                });
                const byJob = {};
                shifts.forEach(s => {
                    if (!byJob[s.jobType]) byJob[s.jobType] = { earnings: 0, tips: 0, hours: 0, count: 0 };
                    byJob[s.jobType].earnings += parseFloat(s.total) || 0;
                    byJob[s.jobType].tips += parseFloat(s.tip) || 0;
                    byJob[s.jobType].hours += calcHours(s.start, s.end);
                    byJob[s.jobType].count++;
                });
                return { totalEarnings, totalTips, totalTravel, totalHours, byMonth, byJob };
            }, [shifts]);

            const exportCSV = () => {
                const header = "תאריך,סוג עבודה,שעת התחלה,שעת סיום,שעות,סה\"כ,טיפ,נסיעות,הערות";
                const rows = shifts.map(s => {
                    const job = jobs.find(j => j.id === s.jobType);
                    return [s.date, job?.label || s.jobType, s.start, s.end, calcHours(s.start, s.end), s.total, s.tip, s.travel || 0, '"' + (s.notes || "") + '"'].join(",");
                });
                const csv = [header, ...rows].join("\n");
                const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a"); a.href = url; a.download = "ShiftLog_Export.csv"; a.click();
            };

            const monthKeys = Object.keys(stats.byMonth).sort((a, b) => b.localeCompare(a));
            const maxEarnings = Math.max(...monthKeys.map(k => stats.byMonth[k].earnings + stats.byMonth[k].tips), 1);

            return (
                <div style={st.root}>
                    {toast && <div style={st.toast}>{toast}</div>}

                    {showJobManager && (
                        <div style={st.overlay} onClick={() => setShowJobManager(false)}>
                            <div style={st.modal} onClick={e => e.stopPropagation()}>
                                <div style={st.modalHead}>
                                    <span style={st.modalTitle}>⚙️ ניהול עבודות</span>
                                    <button style={st.closeBtn} onClick={() => setShowJobManager(false)}>✕</button>
                                </div>
                                <div style={{ marginBottom: 20 }}>
                                    {jobs.map(j => (
                                        <div key={j.id} style={st.jobRow}>
                                            <span>{j.icon} {j.label}</span>
                                            <button style={st.delMini} onClick={() => setJobs(jobs.filter(x => x.id !== j.id))}>🗑️</button>
                                        </div>
                                    ))}
                                </div>
                                <input placeholder="שם עבודה חדשה..." style={st.input} value={newJobLabel} onChange={e => setNewJobLabel(e.target.value)} />
                                <button style={st.btnPrimary} onClick={() => {
                                    if(!newJobLabel) return;
                                    setJobs([...jobs, {id: Date.now(), label: newJobLabel, icon: "💼", color: "#3b82f6"}]);
                                    setNewJobLabel("");
                                }}>הוסף עבודה</button>
                            </div>
                        </div>
                    )}

                    <header style={st.header}>
                        <div style={st.headerInner}>
                            <div>
                                <div style={st.logo}>⚡ ShiftLog</div>
                                <div style={st.logoSub}>ניהול שכר חכם</div>
                            </div>
                            <div style={{textAlign: 'left'}}>
                                <div style={st.hVal}>{formatCurrency(stats.totalEarnings + stats.totalTips)}</div>
                                <div style={st.hLbl}>סה״כ רווח</div>
                            </div>
                        </div>
                    </header>

                    <nav style={st.nav}>
                        <button style={{...st.navBtn, ...(view === 'shifts' ? st.navActive : {})}} onClick={() => setView('shifts')}>📋 משמרות</button>
                        <button style={{...st.navBtn, ...(view === 'stats' ? st.navActive : {})}} onClick={() => setView('stats')}>📊 סטטיסטיקה</button>
                        <button style={st.navAdd} onClick={() => { setForm(emptyForm); setEditId(null); setView('add'); }}>+ חדש</button>
                    </nav>

                    <main style={st.main}>
                        {view === 'add' && (
                            <div style={st.card}>
                                <h2 style={st.cardTitle}>{editId ? "עריכת משמרת" : "משמרת חדשה"}</h2>
                                <div style={st.fg}>
                                    <label style={st.lbl}>סוג עבודה</label>
                                    <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                                        {jobs.map(j => (
                                            <button key={j.id} style={{...st.jobPill, ...(form.jobType === j.id ? {background: j.color, color:'#000', borderColor: j.color} : {})}} onClick={() => setForm({...form, jobType: j.id})}>
                                                {j.icon} {j.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div style={st.fg}><label style={st.lbl}>תאריך</label><input type="date" style={st.input} value={form.date} onChange={e => setForm({...form, date: e.target.value})}/></div>
                                <div style={st.r2}>
                                    <div style={st.fg}><label style={st.lbl}>התחלה</label><input type="time" style={st.input} value={form.start} onChange={e => setForm({...form, start: e.target.value})}/></div>
                                    <div style={st.fg}><label style={st.lbl}>סיום</label><input type="time" style={st.input} value={form.end} onChange={e => setForm({...form, end: e.target.value})}/></div>
                                </div>
                                <div style={st.r2}>
                                    <div style={st.fg}><label style={st.lbl}>שכר (₪)</label><input type="number" style={st.input} value={form.total} onChange={e => setForm({...form, total: e.target.value})}/></div>
                                    <div style={st.fg}><label style={st.lbl}>טיפ (₪)</label><input type="number" style={st.input} value={form.tip} onChange={e => setForm({...form, tip: e.target.value})}/></div>
                                </div>
                                <button style={st.btnPrimary} onClick={saveShift}>שמור משמרת</button>
                                {editId && <button style={{...st.btnSec, width:'100%', marginTop:10, color:'#ef4444'}} onClick={() => deleteShift(editId)}>מחק משמרת</button>}
                            </div>
                        )}

                        {view === 'shifts' && (
                            <div>
                                <div style={{display:'flex', justifyContent:'space-between', marginBottom:15}}>
                                    <button style={st.mngBtn} onClick={() => setShowJobManager(true)}>⚙️ הגדרות</button>
                                    <button style={st.mngBtn} onClick={exportCSV}>📥 ייצוא</button>
                                </div>
                                {shifts.length === 0 ? <div style={st.empty}>אין משמרות עדיין</div> : 
                                shifts.sort((a,b) => b.date.localeCompare(a.date)).map(s => {
                                    const job = jobs.find(j => j.id === s.jobType);
                                    return (
                                        <div key={s.id} style={st.shiftCard} onClick={() => { setForm(s); setEditId(s.id); setView('add'); }}>
                                            <div style={{width:4, background: job?.color || '#333'}} />
                                            <div style={{flex:1, padding:12}}>
                                                <div style={{fontWeight:700}}>{job?.label} | {s.date}</div>
                                                <div style={{fontSize:12, color:'#888'}}>{s.start} - {s.end} ({calcHours(s.start, s.end)} שעות)</div>
                                            </div>
                                            <div style={{padding:12, textAlign:'left'}}>
                                                <div style={{fontWeight:700, color:'#f59e0b'}}>{formatCurrency(parseFloat(s.total) + (parseFloat(s.tip)||0))}</div>
                                                <div style={{fontSize:10, color:'#666'}}>{formatCurrency((parseFloat(s.total) + (parseFloat(s.tip)||0)) / calcHours(s.start, s.end))}/שעה</div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}

                        {view === 'stats' && (
                            <div>
                                <div style={st.statsGrid}>
                                    <div style={st.statCard}><h3>{formatCurrency(stats.totalEarnings)}</h3><p>שכר בסיס</p></div>
                                    <div style={st.statCard}><h3>{formatCurrency(stats.totalTips)}</h3><p>טיפים</p></div>
                                    <div style={st.statCard}><h3>{stats.totalHours.toFixed(1)}</h3><p>שעות סה״כ</p></div>
                                    <div style={st.statCard}><h3>{formatCurrency((stats.totalEarnings + stats.totalTips) / (stats.totalHours || 1))}</h3><p>ממוצע לשעה</p></div>
                                </div>
                                <div style={st.card}>
                                    <h3 style={{marginTop:0, fontSize:16}}>הכנסות לפי חודש</h3>
                                    {monthKeys.map(k => (
                                        <div key={k} style={{marginBottom:10}}>
                                            <div style={{display:'flex', justifyContent:'space-between', fontSize:12, marginBottom:4}}>
                                                <span>{k}</span>
                                                <span>{formatCurrency(stats.byMonth[k].earnings + stats.byMonth[k].tips)}</span>
                                            </div>
                                            <div style={{height:8, background:'#1a1a1f', borderRadius:4, overflow:'hidden'}}>
                                                <div style={{height:'100%', background:'#f59e0b', width: `${((stats.byMonth[k].earnings + stats.byMonth[k].tips) / maxEarnings) * 100}%`}} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const st = {
            root: { minHeight:"100vh", background:"#0d0d0f", color:"#e8e4dc", direction:"rtl" },
            header: { background:"#13131a", padding:"25px 20px", borderBottom:"1px solid #2a2420" },
            headerInner: { maxWidth:520, margin:"0 auto", display:"flex", justifyContent:"space-between", alignItems:"center" },
            logo: { fontSize:24, fontWeight:900, color:"#f59e0b", letterSpacing:"-1px" },
            logoSub: { fontSize:12, color:"#666" },
            hVal: { fontSize:20, fontWeight:800, color:"#fff" },
            hLbl: { fontSize:11, color:"#666", textAlign:'left' },
            nav: { maxWidth:520, margin:"15px auto", display:"flex", gap:10, padding:"0 16px" },
            navBtn: { flex:1, padding:"12px", borderRadius:12, border:"1px solid #2a2420", background:"transparent", color:"#888", fontWeight:600 },
            navActive: { background:"#f59e0b22", color:"#f59e0b", borderColor:"#f59e0b" },
            navAdd: { padding:"0 25px", borderRadius:12, background:"#f59e0b", color:"#000", fontWeight:800, border:"none" },
            main: { maxWidth:520, margin:"0 auto", padding:"0 16px 50px" },
            card: { background:"#13131a", border:"1px solid #2a2420", borderRadius:20, padding:20, marginBottom:15 },
            cardTitle: { margin:"0 0 20px", fontSize:18 },
            input: { width:"100%", background:"#0d0d0f", border:"1px solid #2a2420", borderRadius:12, padding:14, color:"#fff", marginBottom:12, outline:'none' },
            r2: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 },
            fg: { marginBottom:15 },
            lbl: { display:"block", fontSize:13, color:"#888", marginBottom:8 },
            btnPrimary: { width:"100%", padding:16, background:"#f59e0b", border:"none", borderRadius:12, fontWeight:800, fontSize:16, cursor:'pointer' },
            btnSec: { background:"transparent", border:"1px solid #2a2420", color:"#888", padding:12, borderRadius:12 },
            shiftCard: { background:"#13131a", border:"1px solid #2a2420", borderRadius:15, marginBottom:10, display:"flex", overflow:"hidden", cursor:'pointer' },
            statCard: { background:"#13131a", padding:15, borderRadius:18, textAlign:"center", border:"1px solid #2a2420" },
            statsGrid: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:15 },
            empty: { textAlign:'center', padding:40, color:'#444' },
            mngBtn: { background:'transparent', border:'1px solid #2a2420', color:'#666', padding:'6px 12px', borderRadius:8, fontSize:12 },
            jobPill: { padding:"8px 15px", borderRadius:10, border:"1px solid #2a2420", background:"transparent", color:"#888", fontSize:13 },
            overlay: { position:"fixed", inset:0, background:"#000d", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", padding:20 },
            modal: { background:"#13131a", padding:25, borderRadius:25, width:"100%", maxWidth:400, border:'1px solid #2a2420' },
            modalHead: { display:'flex', justifyContent:'space-between', marginBottom:20 },
            delMini: { background:'transparent', border:'none', color:'#ef4444', cursor:'pointer' },
            jobRow: { display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid #1a1a1f' }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftTracker />);
    </script>
</body>
</html>
