<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ShiftLog</title>
    <!-- טעינת ספריות גרסה יציבה -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0d0f; font-family: system-ui, -apple-system, sans-serif; color: #e8e4dc; direction: rtl; }
        #root { min-height: 100vh; padding-bottom: 50px; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .card { background: #13131a; border: 1px solid #2a2420; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .btn { padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-primary { background: #f59e0b; color: #0d0d0f; }
        .input { width: 100%; background: #0d0d0f; border: 1px solid #2a2420; border-radius: 10px; padding: 12px; color: #fff; margin-top: 5px; margin-bottom: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #2a2420; margin-bottom: 10px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 10px; background: #1a1a1f; border: 1px solid #2a2420; color: #888; border-radius: 8px; }
        .nav-btn.active { border-color: #f59e0b; color: #fff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('list'); // list, add, stats
            const [shifts, setShifts] = useState(() => {
                const saved = localStorage.getItem('shifts_data');
                return saved ? JSON.parse(saved) : [];
            });

            // שמירה אוטומטית ל-LocalStorage
            useEffect(() => {
                localStorage.setItem('shifts_data', JSON.stringify(shifts));
            }, [shifts]);

            const [formData, setFormData] = useState({ date: new Date().toISOString().split('T')[0], start: '', end: '', pay: '', tip: '' });

            const addShift = () => {
                if (!formData.start || !formData.end) return alert("נא להזין שעות");
                setShifts([{ ...formData, id: Date.now() }, ...shifts]);
                setView('list');
                setFormData({ date: new Date().toISOString().split('T')[0], start: '', end: '', pay: '', tip: '' });
            };

            const totalMoney = shifts.reduce((sum, s) => sum + (Number(s.pay) || 0) + (Number(s.tip) || 0), 0);

            return (
                <div className="container">
                    <div className="header">
                        <div>
                            <h1 style={{color: '#f59e0b'}}>⚡ ShiftLog</h1>
                            <p style={{fontSize: '12px', color: '#666'}}>ניהול שכר ומשמרות</p>
                        </div>
                        <div style={{textAlign: 'left'}}>
                            <div style={{fontSize: '20px', fontWeight: 'bold'}}>₪{totalMoney}</div>
                            <div style={{fontSize: '11px', color: '#666'}}>סה"כ רווחים</div>
                        </div>
                    </div>

                    <div className="nav">
                        <button className={`nav-btn ${view === 'list' ? 'active' : ''}`} onClick={() => setView('list')}>📋 משמרות</button>
                        <button className={`nav-btn ${view === 'add' ? 'active' : ''}`} onClick={() => setView('add')}>➕ חדש</button>
                        <button className={`nav-btn ${view === 'stats' ? 'active' : ''}`} onClick={() => setView('stats')}>📊 דוח</button>
                    </div>

                    {view === 'add' && (
                        <div className="card">
                            <label>תאריך</label>
                            <input className="input" type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                            <label>שעת התחלה</label>
                            <input className="input" type="time" onChange={e => setFormData({...formData, start: e.target.value})} />
                            <label>שעת סיום</label>
                            <input className="input" type="time" onChange={e => setFormData({...formData, end: e.target.value})} />
                            <label>שכר בסיס (₪)</label>
                            <input className="input" type="number" placeholder="0" onChange={e => setFormData({...formData, pay: e.target.value})} />
                            <label>טיפים (₪)</label>
                            <input className="input" type="number" placeholder="0" onChange={e => setFormData({...formData, tip: e.target.value})} />
                            <button className="btn btn-primary" onClick={addShift}>שמור משמרת</button>
                        </div>
                    )}

                    {view === 'list' && (
                        <div>
                            {shifts.length === 0 && <p style={{textAlign: 'center', color: '#666', marginTop: '40px'}}>אין משמרות רשומות</p>}
                            {shifts.map(s => (
                                <div key={s.id} className="card" style={{display: 'flex', justifyContent: 'space-between'}}>
                                    <div>
                                        <div style={{fontWeight: 'bold'}}>{s.date}</div>
                                        <div style={{fontSize: '13px', color: '#888'}}>{s.start} - {s.end}</div>
                                    </div>
                                    <div style={{textAlign: 'left'}}>
                                        <div style={{color: '#f59e0b', fontWeight: 'bold'}}>₪{Number(s.pay) + Number(s.tip)}</div>
                                        <div style={{fontSize: '11px', color: '#444'}}>טיפ: ₪{s.tip || 0}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === 'stats' && (
                        <div className="card" style={{textAlign: 'center'}}>
                            <h3>סיכום כללי</h3>
                            <div style={{margin: '20px 0', fontSize: '32px', color: '#f59e0b'}}>₪{totalMoney}</div>
                            <p>מספר משמרות: {shifts.length}</p>
                            <button className="btn" style={{marginTop: '20px', background: '#1a1a1f', color: '#888'}} 
                                    onClick={() => {if(confirm('למחוק הכל?')) setShifts([])}}>אפס נתונים</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
